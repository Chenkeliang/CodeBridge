<!doctype html>
<html lang="zh-CN" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#18181b" />
    <link rel="icon" type="image/svg+xml" href="/workbench/brand/agnet-mark.svg" />
    <title>AGNET · CodeBridge Workbench</title>
    <script>
      // Apply the persisted theme before first paint so the boot background matches.
      (function () {
        var stored = null;
        try { stored = window.localStorage.getItem("codebridge:web-theme"); } catch (error) { /* ignore */ }
        var theme = stored === "paper" || stored === "carbon" ? stored
          : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "carbon" : "paper");
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body class="h-full overflow-hidden bg-canvas text-ink antialiased">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
