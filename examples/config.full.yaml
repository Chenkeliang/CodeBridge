feishu:
  domain: https://open.feishu.cn
  appId: ${FEISHU_APP_ID}
  appSecret: ${FEISHU_APP_SECRET}
  policy:
    requireMention: true
    dmMode: open
    respondToMentionAll: false
    scenarios:
      - name: trusted_dev_group
        chats: ["oc_xxxxxxxx"]
        requireMention: false

# 可选；配置后与飞书同时启动，也支持仅配置 Telegram token 的模式
# telegram:
#   botToken: ${TELEGRAM_BOT_TOKEN}
#   allowedUsers: ["123456789"]
#   allowedChats: ["-1001234567890"]
#   pollingTimeoutSec: 25

runner:
  url: http://127.0.0.1:19789
  token: ${RUNNER_TOKEN}

defaultBackend: cursor

backends:
  cursor:
    type: cursor-cli
    acpCommand: cursor-agent
    acpArgs: ["acp"]
  claude:
    type: claude-code
    acpCommand: npx
    acpArgs: ["-y", "@agentclientprotocol/claude-agent-acp@0.64.2"]
    # Claude 的 ACP mode 默认；也可在飞书用 /permission 实时查看和覆盖
    claudePermissionMode: bypassPermissions
  codex:
    type: codex
    acpCommand: npx
    acpArgs: ["-y", "@agentclientprotocol/codex-acp@1.1.9"]

workspaces:
  root: ~/Projects
  default: ~/Projects

runnerHost:
  listen: 127.0.0.1:19789
  maxConcurrentRuns: 4
  acpPermissionPolicy: auto_allow

