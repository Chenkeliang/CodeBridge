feishu:
  domain: https://open.feishu.cn
  appId: ${FEISHU_APP_ID}
  appSecret: ${FEISHU_APP_SECRET}
  policy:
    requireMention: true
    dmMode: open
    respondToMentionAll: false
    scenarios:
      - name: trusted_dev_group
        chats: ["oc_xxxxxxxx"]
        requireMention: false

runner:
  url: http://127.0.0.1:19789
  token: ${RUNNER_TOKEN}

defaultBackend: cursor

backends:
  cursor:
    type: cursor-cli
    acpCommand: cursor-agent
    acpArgs: ["acp"]
  claude:
    type: claude-code
    acpCommand: npx
    acpArgs: ["-y", "@agentclientprotocol/claude-agent-acp@0.63.0"]
    # Claude 的 ACP mode 默认；也可在飞书用 /permission 实时查看和覆盖
    claudePermissionMode: bypassPermissions
  codex:
    type: codex
    acpCommand: npx
    acpArgs: ["-y", "@agentclientprotocol/codex-acp@1.1.7"]

workspaces:
  root: ~/Projects
  default: ~/Projects

runnerHost:
  listen: 127.0.0.1:19789
  maxConcurrentRuns: 4
  acpPermissionPolicy: auto_allow

