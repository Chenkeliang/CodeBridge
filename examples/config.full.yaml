feishu:
  domain: https://open.feishu.cn
  appId: ${FEISHU_APP_ID}
  appSecret: ${FEISHU_APP_SECRET}
  policy:
    requireMention: true
    dmMode: open
    respondToMentionAll: false
    scenarios:
      - name: trusted_dev_group
        chats: ["oc_xxxxxxxx"]
        requireMention: false

# 可选；配置后与飞书同时启动，也支持仅配置 Telegram token 的模式
# telegram:
#   botToken: ${TELEGRAM_BOT_TOKEN}
#   allowedUsers: ["123456789"]
#   allowedChats: ["-1001234567890"]
#   pollingTimeoutSec: 25

runner:
  url: http://127.0.0.1:19789
  token: ${RUNNER_TOKEN}

defaultBackend: cursor

backends:
  cursor:
    type: cursor-cli
    acpCommand: cursor-agent
    acpArgs: ["acp"]
  claude:
    type: claude-code
    acpCommand: npx
    acpArgs: ["-y", "@agentclientprotocol/claude-agent-acp@0.64.2"]
    # Claude 的 ACP mode 默认；也可在飞书用 /permission 实时查看和覆盖
    claudePermissionMode: bypassPermissions
  codex:
    type: codex
    acpCommand: npx
    acpArgs: ["-y", "@agentclientprotocol/codex-acp@1.1.9"]
  # 可选；Pi 通过 Node SDK 在 Runner 内执行，不启动 pi --mode rpc
  # pi:
  #   type: pi-sdk

workspaces:
  root: ~/Projects
  default: ~/Projects

# 可选：把正式 Project Catalog 放在单独 Git 仓库或 CodeBridge 配置仓库中。
# 提案只创建本地 feature branch/commit，不自动 merge 或 push。
# orchestration:
#   projectCatalog:
#     repositoryPath: ~/Projects/codebridge-catalog
#     baseRef: origin/main
#     catalogPath: catalog/projects.yaml
#   mcpServers:
#     local-tools:
#       transport: stdio
#       command: npx
#       args: [local-tools-mcp]
#       env: [LOCAL_TOOLS_TOKEN] # 只声明变量名，不在配置中写 token
#       revision: config:1
#     shared-tools:
#       transport: http
#       url: https://mcp.example.com/api

runnerHost:
  listen: 127.0.0.1:19789
  maxConcurrentRuns: 4
  acpPermissionPolicy: auto_allow

