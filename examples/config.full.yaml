#     catalogPath: catalog/projects.yaml
#   mcpServers:
#     local-tools:
#       transport: stdio
#       command: npx
#       args: [local-tools-mcp]
#       env: [LOCAL_TOOLS_TOKEN] # 只声明变量名，不在配置中写 token
#       revision: config:1
#     shared-tools:
#       transport: http
#       url: https://mcp.example.com/api
#   session:
#     # 新消息到达时，若当前会话闲置太久或上下文太满，自动开新会话（等同 /new，可 /resume 找回）。
#     # 有运行中或排队的任务时不轮换；飞书告警群不轮换。
#     autoRotate:
#       enabled: true        # 默认开启
#       idleHours: 12        # 闲置超过该小时数即轮换；0 关闭
#       maxContextRatio: 0.5 # 上下文用量达到模型窗口的该比例即轮换

runnerHost:
  listen: 127.0.0.1:19789
  maxConcurrentRuns: 4
  acpPermissionPolicy: auto_allow

