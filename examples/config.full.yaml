# 密钥字段（appSecret / botToken / runner.token）可写引用，不必明文：
#   keychain:<服务名>  macOS 钥匙串或 Linux Secret Service；`codebridge secrets migrate` 可一键迁移
#   env:<变量名>       从环境变量读取
# 应用保存配置时只写回引用，不会把解析后的密钥落盘。`codebridge secrets status` 查看来源。
feishu:
  domain: https://open.feishu.cn
  appId: cli_xxxxxxxx
  appSecret: keychain:codebridge.feishu.appSecret
  policy:
    requireMention: true
    dmMode: open
    respondToMentionAll: false
    scenarios:
      - name: trusted_dev_group
        chats: ["oc_xxxxxxxx"]
        requireMention: false

# 可选；配置后与飞书同时启动，也支持仅配置 Telegram token 的模式
# telegram:
#   botToken: env:TELEGRAM_BOT_TOKEN
#   allowedUsers: ["123456789"]
#   allowedChats: ["-1001234567890"]
#   pollingTimeoutSec: 25

runner:
  url: http://127.0.0.1:19789
  token: keychain:codebridge.runner.token

defaultBackend: cursor

backends:
  cursor:
    type: cursor-cli
    acpCommand: cursor-agent
    acpArgs: ["acp"]
  claude:
    type: claude-code
    acpCommand: npx
    acpArgs: ["-y", "@agentclientprotocol/claude-agent-acp@0.78.0"]
    # Claude 的 ACP mode 默认；也可在飞书用 /permission 实时查看和覆盖
    claudePermissionMode: bypassPermissions
  codex:
    type: codex
    acpCommand: npx
    acpArgs: ["-y", "@agentclientprotocol/codex-acp@1.12.0"]
  pi:
    type: pi-sdk
  opencode:
    type: generic-spawn
    acpCommand: opencode
    acpArgs: ["acp"]

workspaces:
  root: ~/Projects
  default: ~/Projects

# 可选：把正式 Project Catalog 放在单独 Git 仓库或 CodeBridge 配置仓库中。
# 提案只创建本地 feature branch/commit，不自动 merge 或 push。
