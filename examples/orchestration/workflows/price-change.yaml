schema_version: 1
workflow_id: price-change
name: 价格调整检查与执行
kind: runbook
status: draft
description: 先确认商品和规则，再按规则状态决定更新、默认值或人工处理路径。
inputs: [sku]
steps:
  - id: resolve_sku
    capability: datamaster.lookup
    mode: read_only

  - id: inspect_rule
    capability: price_rule.query
    mode: read_only
    depends_on: [resolve_sku]

  - id: choose_path
    branches:
      - when: rule_exists == true
        next: update_rule
      - when: rule_exists == false
        next: use_default
      - when: otherwise
        next: manual_review
    depends_on: [inspect_rule]

  - id: update_rule
    capability: price_rule.update
    mode: production_write
    approval: required

  - id: use_default
    capability: price_rule.set_default
    mode: production_write
    approval: required

  - id: manual_review
    mode: manual
    purpose: 规则信息冲突或无法确认时暂停，等待用户补充事实

  - id: verify
    capability: price_rule.query
    mode: read_only
    depends_on: [update_rule, use_default]
